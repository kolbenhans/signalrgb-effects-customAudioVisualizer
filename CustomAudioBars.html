<head>
  <title>Keyboard Visualizer Port</title>
  <meta description="Canvas port of the audio-visualizer-gui keyboard effects: Bars, Dots, Center, Kitt, Waterdrop, with the same 6 palette presets and auto-gain." />
  <meta publisher="kolbenhans" />

  <meta property="effectMode" label="Effect Mode" type="combobox" values="Bars,Dots,Center,Kitt,Waterdrop" default="Bars" />
  <meta property="paletteName" label="Palette" type="combobox" values="Winamp,Purple,Ice,Fire,Neon,Ocean" default="Winamp" />
  <meta property="bandCount" label="Bar Count" type="number" min="8" max="80" default="40" />
  <meta property="colorLevels" label="Color Levels" type="number" min="1" max="40" default="5" />
  <meta property="logBands" label="Log-Scale Frequency Bands" type="boolean" default="1" />
  <meta property="brightnessCap" label="Brightness Cap %" type="number" min="10" max="100" default="60" />
  <meta property="decay" label="Decay Speed" type="number" min="1" max="40" default="15" />
  <meta property="bassThreshold" label="Bass Threshold (Waterdrop)" type="number" min="50" max="255" default="187" />
  <meta property="silenceThreshold" label="Silence Threshold (dB)" type="number" min="-80" max="-10" default="-40" />
  <meta property="BgColor" label="Background color" type="color" default="#000000" min="0" max="360" />
</head>

<body style="margin: 0; padding: 0; background: #000;">
  <canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
  // Port of audio-visualizer-gui's src/render.rs + src/audio.rs banding/
  // auto-gain logic. engine.audio.freq (200 values) stands in for the
  // Rust side's FFT bins.
  var canvas, ctx;
  const AUTO_DECAY = 0.995;
  const AUTO_FLOOR = 10;
  const AUTO_LEVEL = 0.85;

  var autoMax = [];
  var display = [];

  // geomspace(1, 200, nBands+1) over *index* space -- we don't know the
  // true Hz calibration of engine.audio.freq's 200 slots (SignalRGB
  // doesn't document it), so this approximates audio.rs's band_edges()
  // (geomspace(60, 12000, n_bands+1) over real Hz) by log-spacing the
  // index range instead. Same perceptual effect -- more resolution for
  // bass, less for highs -- without needing the real bin-to-Hz mapping.
  function bandEdges(nBands) {
    var lo = 1, hi = 200;
    var ratio = Math.pow(hi / lo, 1 / nBands);
    var edges = [];
    var v = lo;
    for (var i = 0; i <= nBands; i++) {
      edges.push(v);
      v *= ratio;
    }
    return edges;
  }

  // Interpolates a 5-stop preset up/down to `levels` colors so Color
  // Levels isn't locked to the Rust side's fixed N_LEVELS=5.
  function interpolatePalette(stops, levels) {
    if (levels === stops.length) return stops;
    var out = [];
    for (var i = 0; i < levels; i++) {
      var t = levels === 1 ? 0 : i / (levels - 1);
      var pos = t * (stops.length - 1);
      var i0 = Math.floor(pos);
      var i1 = Math.min(stops.length - 1, i0 + 1);
      var f = pos - i0;
      var c0 = stops[i0], c1 = stops[i1];
      out.push([
        Math.round(c0[0] + (c1[0] - c0[0]) * f),
        Math.round(c0[1] + (c1[1] - c0[1]) * f),
        Math.round(c0[2] + (c1[2] - c0[2]) * f),
      ]);
    }
    return out;
  }

  // Winamp / Purple / Ice / Fire / Neon / Ocean -- same RGB stops as
  // render.rs::PRESETS.
  const PALETTES = {
    Winamp: [[0,255,0],[160,255,0],[255,220,0],[255,80,0],[255,0,0]],
    Purple: [[76,0,153],[180,0,255],[0,0,255],[0,255,255],[255,255,255]],
    Ice: [[0,80,255],[0,180,255],[0,255,255],[120,255,255],[255,255,255]],
    Fire: [[120,0,0],[255,0,0],[255,80,0],[255,180,0],[255,255,0]],
    Neon: [[255,0,128],[180,0,255],[0,0,255],[0,255,128],[255,255,0]],
    Ocean: [[0,10,60],[0,40,160],[0,120,255],[0,210,255],[180,255,255]],
  };

  var drops = [];
  var nextColor = 0;
  var cooldown = 0;

  function onEngineReady() {
    canvas = document.getElementById("exCanvas");
    ctx = canvas.getContext("2d");
    for (var i = 0; i < 6; i++) {
      drops.push({ radius: 0, age: 0, active: false, color: 0 });
    }
    window.requestAnimationFrame(update);
  }

  // autoMax/display are sized to bandCount lazily (slider can change it
  // live) instead of fixed at onEngineReady -- a reset on resize is fine,
  // auto-gain re-settles within a couple frames.
  function ensureBandArrays(nBands) {
    if (display.length === nBands) return;
    autoMax = [];
    display = [];
    for (var i = 0; i < nBands; i++) {
      autoMax.push(AUTO_FLOOR);
      display.push(0);
    }
  }

  function vs(v, capPct) {
    return Math.max(0, Math.min(255, Math.round((v * capPct) / 100)));
  }

  function rgbStr(col, capPct) {
    return "rgb(" + vs(col[0], capPct) + "," + vs(col[1], capPct) + "," + vs(col[2], capPct) + ")";
  }

  // Modes 0/1 (render_bars): filled columns (Bars) or just the topmost lit
  // cell per column (Dots / outline=true).
  function renderBars(heights, pal, outline, capPct, nBands, nLevels) {
    var colW = 320 / nBands;
    var rowH = 200 / nLevels;
    for (var c = 0; c < nBands; c++) {
      var h = heights[c];
      for (var level = 0; level < nLevels; level++) {
        var lit = outline ? (h > 0 && level === h - 1) : (level < h);
        if (!lit) continue;
        ctx.fillStyle = rgbStr(pal[level], capPct);
        var x = c * colW;
        var y = 200 - (level + 1) * rowH;
        ctx.fillRect(x, y, Math.max(1, colW - 1), Math.max(1, rowH - 1));
      }
    }
  }

  // Modes 2/3 (render_center): horizontal bars expanding from canvas
  // center. Kitt: solid color per row. Center: color bucketed by distance.
  function renderCenter(disp, pal, kitt, capPct, nBands, nLevels) {
    var rowH = 200 / nLevels;
    var maxDist = 160;
    for (var row = 0; row < nLevels; row++) {
      var bandIdx = Math.min(row * 2, nBands - 1);
      var val = disp[bandIdx];
      if (val <= 0) continue;
      var width = Math.min(maxDist, (val * maxDist) / 210);
      var y = row * rowH;

      if (kitt) {
        ctx.fillStyle = rgbStr(pal[row], capPct);
        ctx.fillRect(160 - width, y, width * 2, Math.max(1, rowH - 1));
      } else {
        var segs = nLevels;
        var segW = width / segs;
        for (var s = 0; s < segs; s++) {
          ctx.fillStyle = rgbStr(pal[s], capPct);
          ctx.fillRect(160 + s * segW, y, segW + 1, Math.max(1, rowH - 1));
          ctx.fillRect(160 - (s + 1) * segW, y, segW + 1, Math.max(1, rowH - 1));
        }
      }
    }
  }

  // Mode 4 (render_waterdrop): bass-triggered rings from each half's
  // center. Per-pixel distance falloff (Rust side) replaced with a
  // stroked arc + alpha fade -- same look, no 320x200 per-pixel loop.
  function updateWaterdrop(bass, threshold, pal, capPct, nLevels) {
    if (cooldown > 0) cooldown--;
    if (bass > threshold && cooldown === 0) {
      var d = drops.find(function (d) { return !d.active; });
      if (d) {
        d.radius = 0;
        d.age = 255;
        d.active = true;
        d.color = nextColor % nLevels;
        nextColor = (nextColor + 1) % nLevels;
        cooldown = 3;
      }
    }

    var centers = [[80, 100], [240, 100]];
    for (var ci = 0; ci < centers.length; ci++) {
      for (var di = 0; di < drops.length; di++) {
        var d = drops[di];
        if (!d.active) continue;
        var col = pal[d.color];
        var alpha = d.age / 255;
        var c = vs(col[0], capPct), g = vs(col[1], capPct), b = vs(col[2], capPct);
        ctx.beginPath();
        ctx.arc(centers[ci][0], centers[ci][1], d.radius, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(" + c + "," + g + "," + b + "," + alpha + ")";
        ctx.lineWidth = 6;
        ctx.stroke();
      }
    }

    for (var di = 0; di < drops.length; di++) {
      var d = drops[di];
      if (!d.active) continue;
      d.radius += 6;
      if (d.age > 8) d.age -= 8; else d.active = false;
      if (d.radius > 220) d.active = false;
    }
  }

  function update() {
    var nBands = bandCount;
    var nLevels = colorLevels;
    ensureBandArrays(nBands);

    ctx.fillStyle = BgColor;
    ctx.fillRect(0, 0, 320, 200);

    if (engine.audio.level > silenceThreshold) {
      let freqs = new Int8Array(engine.audio.freq);
      var raw = [];

      if (logBands) {
        var edges = bandEdges(nBands);
        for (var b = 0; b < nBands; b++) {
          var lo = Math.round(edges[b]) - 1;
          var hi = Math.max(lo + 1, Math.round(edges[b + 1]) - 1);
          hi = Math.min(hi, 200);
          var sum = 0, n = 0;
          for (var k = lo; k < hi; k++) {
            var v = freqs[k];
            sum += v > 0 ? v : 0;
            n++;
          }
          raw.push(n > 0 ? sum / n : 0);
        }
      } else {
        var chunk = Math.floor(200 / nBands);
        for (var b = 0; b < nBands; b++) {
          var sum = 0;
          for (var k = 0; k < chunk; k++) {
            var v = freqs[b * chunk + k];
            sum += v > 0 ? v : 0;
          }
          raw.push(sum / chunk);
        }
      }

      for (var b = 0; b < nBands; b++) {
        autoMax[b] = Math.max(autoMax[b] * AUTO_DECAY, raw[b], AUTO_FLOOR);
        var normalized = Math.min(255, Math.max(0, (raw[b] / autoMax[b]) * 255 * AUTO_LEVEL));
        display[b] = normalized > display[b] ? normalized : Math.max(display[b] - decay, normalized);
      }
    } else {
      for (var b = 0; b < nBands; b++) {
        display[b] = Math.max(0, display[b] - decay);
      }
    }

    var pal = interpolatePalette(PALETTES[paletteName], nLevels);

    if (effectMode === "Bars" || effectMode === "Dots") {
      var heights = display.map(function (d) {
        return Math.min(nLevels, Math.floor((d * (nLevels + 1)) / 256));
      });
      renderBars(heights, pal, effectMode === "Dots", brightnessCap, nBands, nLevels);
    } else if (effectMode === "Center" || effectMode === "Kitt") {
      renderCenter(display, pal, effectMode === "Kitt", brightnessCap, nBands, nLevels);
    } else if (effectMode === "Waterdrop") {
      var bass = Math.max(display[0], display[1], display[2]);
      updateWaterdrop(bass, bassThreshold, pal, brightnessCap, nLevels);
    }

    window.requestAnimationFrame(update);
  }
</script>
